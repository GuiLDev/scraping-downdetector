# Configuracao do Downdetector Banking Monitor.

[collector]
# Coletores disponiveis: "demo" (dados sinteticos) e "downdetector" (stub, Etapa 2).
active = "demo"

[schedule]
interval_minutes = 60
# Folga de 1,5x o intervalo: dado mais antigo que isso vira "Sem dados".
stale_after_minutes = 90

[server]
host = "127.0.0.1"
port = 8765

[demo]
seed = 20261028

[[categories]]
id = "tradicionais"
name = "Bancos tradicionais"
order = 1

[[categories]]
id = "digitais"
name = "Bancos digitais"
order = 2

[[categories]]
id = "carteiras"
name = "Carteiras e instituicoes de pagamento"
order = 3

[[categories]]
id = "infraestrutura"
name = "Infraestrutura"
order = 4

# dd_label: nome como aparece no Downdetector. Os valores abaixo sao
# provisorios e serao confirmados na Etapa 2.

[[institutions]]
id = "itau"
name = "Itaú"
category = "tradicionais"
dd_label = "Itaú"
enabled = true

