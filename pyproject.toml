[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bankmon"
version = "0.1.0"
description = "Downdetector Banking Monitor: dashboard e infraestrutura de coleta"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "werkzeug>=3.1.9",
    "jinja2>=3.1.6",
    "waitress>=3.0.2",
    # zoneinfo("America/Sao_Paulo") precisa do banco de fusos no Windows
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=9"]
# Testes E2E com navegador real (extensao no Edge); fora da suite padrao (-m e2e)
e2e = ["playwright>=1.64"]

[project.scripts]
bankmon = "bankmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bankmon = ["schema.sql", "web/templates/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: testes com navegador real (Playwright + extensao); rode com -m e2e",
           "real_port: usa a checagem real de porta ocupada do serve (sem o fixture que a desliga)"]
